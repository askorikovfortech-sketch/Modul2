<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Учет расходов</title>
  </head>
  <body class="body">
    <header class="header">
      <div class="header__logotyp">
        <img
          src="images/logo.png"
          alt="FINANCEFLOW"
          width="120"
          height="120"
          class="header__images"
        />
        <div class="header__line"></div>
        <h1 class="header__title">Учет расходов</h1>
      </div>
      <hr class="line" />
    </header>
    <main class="main">
      <div class="main__conteiner">
        <div class="main-input">
          <div class="main-input__block">
            <input
              type="text"
              placeholder="Статья расходов"
              class="main-input__text"
            />
            <hr class="main-input__line" />
          </div>
          <div class="main-input__block">
            <input type="number" placeholder="Сумма" class="main-input__text" />
            <hr class="main-input__line" />
          </div>
          <button type="button" class="main-input__button">Добавить</button>
        </div>
      </div>
      <div class="main-itog">
        <div class="main-itog__box">
          <p class="main-itog__text">Всего:</p>
          <p class="main-itog__sum">5920 ₽</p>
        </div>
      </div>
      <div class="main__block main__invisibility">
        <hr class="main__line" />
        <div class="main-katigories">
          <p class="main-katigories__text">Статья расхода</p>
          <p class="main-katigories__text">Дата</p>
          <p class="main-katigories__text">Сумма расхода</p>
        </div>
      </div>
      <div class="main__block">
        <hr class="main__line" />
        <div class="main-list">
          <ul class="main-list__ul">
            <li class="main-list__item">
              <span class="main-list__category">Продукты</span>
              <div class="main-list__adaptiv">
                <span class="main-list__date"> 19.01.2026 </span>
                <span class="main-list__sum">1223 ₽</span>
              </div>
              <div class="main-list__edit">
                <button type="button" class="main-list__redakter">🖉</button>
                <button type="button" class="main-list__delete">🗑</button>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </main>
  </body>
</html>
